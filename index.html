var QUEST_CHAPTERS = [
  { title: 'الباب الأول: فاتحة الأسماء والجلال', sub: 'المراحل ١ إلى ١٥', from: 1, to: 15 },
  { title: 'الباب الثاني: الرّحمة واللطف والهداية', sub: 'المراحل ١٦ إلى ٣٠', from: 16, to: 30 },
  { title: 'الباب الثالث: العِلم والحِكمة والسّميع البصير', sub: 'المراحل ٣١ إلى ٤٥', from: 31, to: 45 },
  { title: 'الباب الرابع: القوّة والعزّة والقدرة', sub: 'المراحل ٤٦ إلى ٦٠', from: 46, to: 60 },
  { title: 'الباب الخامس: الكرم والرزق والغِنى', sub: 'المراحل ٦١ إلى ٧٥', from: 61, to: 75 },
  { title: 'الباب السادس: العدل والحقّ والحِفظ', sub: 'المراحل ٧٦ إلى ٩٠', from: 76, to: 90 },
  { title: 'الباب السابع: الأوّلية والبقاء والختام', sub: 'المراحل ٩١ إلى ٩٩', from: 91, to: 99 }
];

function vJourney() {
  var jtab = store.journeyTab || 'map';
  var dn = doneCount(), fc = favCount(), st = streak();
  var frontier = nextEpisode() || EPISODES[0];
  var pct = Math.round((dn / EPISODES.length) * 100);

  var h = '<div class="page" style="gap:16px">';

  /* شريط التبديل الثلاثي */
  h += '<div class="seg" role="tablist" aria-label="أقسام خريطة التختيم" style="width:100%">';
  h += '<button type="button" class="seg-btn' + (jtab === 'map' ? ' on' : '') + '" data-jtab="map">🗺️ مسار الخريطة</button>';
  h += '<button type="button" class="seg-btn' + (jtab === 'stats' ? ' on' : '') + '" data-jtab="stats">🏆 حصادي</button>';
  h += '<button type="button" class="seg-btn' + (jtab === 'catalog' ? ' on' : '') + '" data-jtab="catalog">🔍 الفهرس والبحث</button>';
  h += '</div>';

  if (jtab === 'catalog') {
    h += vNamesCatalogInner();
    h += '</div>';
    return h;
  }

  if (jtab === 'stats') {
    h += '<div class="quest-summary-bar">';
    h += '<div class="row" style="justify-content:space-between;align-items:center">';
    h += '<div><div class="small gold" style="font-weight:700">حصاد رحلتك في الأسماء الحسنى</div>';
    h += '<div class="tiny muted">' + ar(dn) + ' من أصل ٩٩ مرحلة مختومة (' + ar(pct) + '٪)</div></div>';
    h += '<span class="tag">' + (dn >= 99 ? '👑 ختمت الرحلة' : 'المرحلة #' + ar(frontier.num)) + '</span>';
    h += '</div>';
    h += '<div style="height:8px;border-radius:99px;background:rgba(255,255,255,0.08);overflow:hidden">';
    h += '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#C9A24B,#FFF3C4);border-radius:99px;transition:width .4s"></div></div>';
    h += '<div class="grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px">';
    h += '<div class="panel" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:700;color:var(--gold-bright)">' + ar(dn) + '</div><div class="tiny muted">مراحل مختومة</div></div>';
    h += '<div class="panel" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:700;color:var(--gold-bright)">' + ar(st) + '</div><div class="tiny muted">سلسلة المواظبة</div></div>';
    h += '<div class="panel" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:700;color:var(--gold-bright)">' + ar(fc) + '</div><div class="tiny muted">في المفضلة</div></div>';
    h += '</div></div>';

    h += '<div class="panel" style="padding:18px;display:flex;flex-direction:column;gap:12px">';
    h += '<div class="row" style="justify-content:space-between;align-items:center">';
    h += '<span class="small gold" style="font-weight:700">🏮 قناديل مواظبتك هذا الأسبوع</span>';
    h += '<span class="tiny muted">' + (st > 0 ? streakText(st) : 'ابدأ يومك الأول') + '</span></div>';
    h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center">';
    var dayNames = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
    for (var di = 6; di >= 0; di--) {
      var dd = new Date();
      dd.setDate(dd.getDate() - di);
      var dk = dayKey(dd);
      var isLitDay = !!(store.days && store.days[dk]);
      var isTodayD = di === 0;
      h += '<div style="padding:10px 4px;border-radius:14px;border:1px solid ' + (isLitDay ? 'rgba(201,162,75,0.55)' : (isTodayD ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)')) + ';background:' + (isLitDay ? 'rgba(201,162,75,0.16)' : 'rgba(255,255,255,0.03)') + '">';
      h += '<div style="font-size:18px;line-height:1.2">' + (isLitDay ? '🏮' : '○') + '</div>';
      h += '<div class="tiny" style="margin-top:4px;font-size:10.5px;color:' + (isLitDay ? 'var(--gold-bright)' : 'var(--muted)') + '">' + (isTodayD ? 'اليوم' : dayNames[dd.getDay()]) + '</div>';
      h += '</div>';
    }
    h += '</div></div>';

    h += '<button type="button" class="pill" style="width:100%" data-start-ep-session="' + frontier.id + '">' + ico(P.book, 18, '#0B0E12') + '<span>أكمل المرحلة #' + ar(frontier.num) + ' «' + esc(frontier.name) + '»</span></button>';
    h += '</div>';
    return h;
  }

  /* تبويب مسار الخريطة التفاعلي (الأبواب السبعة) */
  var activeChap = typeof store.questChapter === 'number' ? store.questChapter : -1;
  if (activeChap < 0 || activeChap >= QUEST_CHAPTERS.length) {
    activeChap = 0;
    for (var ci = 0; ci < QUEST_CHAPTERS.length; ci++) {
      if (frontier.num >= QUEST_CHAPTERS[ci].from && frontier.num <= QUEST_CHAPTERS[ci].to) {
        activeChap = ci;
        break;
      }
    }
  }
  var chap = QUEST_CHAPTERS[activeChap];

  h += '<div class="quest-summary-bar">';
  h += '<div class="row" style="justify-content:space-between;align-items:center">';
  h += '<div><div class="small gold" style="font-weight:700">مسار التختيم المتسلسل</div>';
  h += '<div class="tiny muted">مختوم ' + ar(dn) + ' من ٩٩ • المحطة الحالية: #' + ar(frontier.num) + ' «' + esc(frontier.name) + '»</div></div>';
  h += '<span class="tag">' + ar(pct) + '٪</span>';
  h += '</div>';
  h += '<div style="height:6px;border-radius:99px;background:rgba(255,255,255,0.08);overflow:hidden">';
  h += '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#C9A24B,#FFF3C4);border-radius:99px"></div></div>';
  h += '</div>';

  /* شريط الأبواب السبعة */
  h += '<div class="quest-chapters-bar" role="tablist" aria-label="الأبواب السبعة">';
  for (var cIdx = 0; cIdx < QUEST_CHAPTERS.length; cIdx++) {
    var ch = QUEST_CHAPTERS[cIdx];
    var chDone = 0, chTotal = ch.to - ch.from + 1;
    for (var k = ch.from - 1; k < ch.to && k < EPISODES.length; k++) {
      if (store.done[EPISODES[k].id]) chDone++;
    }
    var isChDone = chDone === chTotal;
    h += '<button type="button" class="chapter-pill' + (cIdx === activeChap ? ' active' : '') + (isChDone ? ' chap-done' : '') + '" data-chap="' + cIdx + '">';
    h += (isChDone ? '✓ ' : '') + 'الباب ' + ar(cIdx + 1) + ' <span style="opacity:.75">(' + ar(chDone) + '/' + ar(chTotal) + ')</span></button>';
  }
  h += '</div>';

  /* لوحة المسار المتعرّج */
  h += '<div class="quest-map-canvas">';
  h += '<div class="quest-chap-header">';
  h += '<div class="small gold" style="font-weight:700">' + esc(chap.title) + '</div>';
  h += '<div class="tiny muted" style="margin-top:4px">' + esc(chap.sub) + ' • افتح كل مرحلة بإتمام تدبّر السابقة</div>';
  h += '</div>';

  h += '<div class="quest-trail">';
  var posCycle = ['pos-center', 'pos-right', 'pos-center', 'pos-left'];
  var chapEps = EPISODES.slice(chap.from - 1, chap.to);
  for (var i = 0; i < chapEps.length; i++) {
    var ep = chapEps[i];
    var isDone = !!store.done[ep.id];
    var isCurr = !isDone && frontier.id === ep.id;
    var isUnlocked = isEpUnlocked(ep);
    var posCls = posCycle[i % 4];

    if (i > 0) {
      h += '<div class="quest-connector" style="' + (isDone || isCurr ? 'background:linear-gradient(to bottom,rgba(226,190,107,0.7),rgba(226,190,107,0.28))' : '') + '"></div>';
    }

    h += '<div class="quest-step-wrap ' + posCls + '">';
    h += '<div class="quest-node-group">';
    if (isCurr) {
      h += '<div class="quest-badge-top">✦ محطتك الحالية</div>';
    }

    var orbCls = isDone ? 'orb-done' : (isCurr ? 'orb-current' : 'orb-upcoming');
    h += '<button type="button" class="quest-orb ' + orbCls + '" data-open-sheet="' + ep.id + '" aria-label="' + esc(ep.name) + '">';
    h += '<span class="orb-num">#' + ar(ep.num) + '</span>';
    h += '<span class="orb-name">' + esc(ep.name) + '</span>';
    h += '</button>';

    if (isCurr) {
      h += '<div class="quest-current-card">';
      h += '<div class="tiny muted">' + esc(ep.meaning) + '</div>';
      h += '<button type="button" class="pill" style="padding:9px 18px;font-size:13px" data-start-ep-session="' + ep.id + '">' + ico(P.book, 15, '#0B0E12') + '<span>ابدأ المرحلة</span></button>';
      h += '</div>';
    } else {
      h += '<div class="quest-node-caption' + (isDone ? ' cap-done' : '') + '">' + (isDone ? '✓ مختومة' : (isUnlocked ? 'متاحة' : '🔒 مغلقة')) + '</div>';
    }

    h += '</div></div>';
  }
  h += '</div>';

  if (activeChap < QUEST_CHAPTERS.length - 1) {
    h += '<div class="quest-gate-card">';
    h += '<div class="small gold" style="font-weight:700">' + esc(QUEST_CHAPTERS[activeChap + 1].title) + '</div>';
    h += '<button type="button" class="quiet" data-chap="' + (activeChap + 1) + '">الانتقال إلى الباب ' + ar(activeChap + 2) + ' ←</button>';
    h += '</div>';
  }

  h += '</div></div>';
  return h;
}

function vNames() {
  return '<div class="page" style="gap:16px">' + vNamesCatalogInner() + '</div>';
}

function vNamesCatalogInner() {
  var dn = doneCount(), fc = favCount();
  var q = (store.search || '').trim();
  var catF = store.catFilter || 'الكل';

  var list = EPISODES.filter(function(e) {
    if (catF === 'المفضلة' && !(store.favs && store.favs[e.id])) return false;
    if (catF === 'المضاءة' && !store.done[e.id]) return false;
    if (catF !== 'الكل' && catF !== 'المضاءة' && catF !== 'المفضلة' && e.cat !== catF) return false;
    if (q) {
      var nq = normAr(q);
      var numStr = String(e.num), arNum = ar(e.num);
      var nuText = (e.nuance && e.nuance.title) ? (e.nuance.title + ' ' + e.nuance.body) : '';
      var haystack = normAr(e.name + ' ' + e.meaning + ' ' + e.tag + ' ' + e.cat + ' ' + nuText);
      if (haystack.indexOf(nq) === -1 && numStr !== q && arNum !== q) {
        return false;
      }
    }
    return true;
  });

  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  var curPage = Math.min(Math.max(0, store.namesPage || 0), totalPages - 1);
  var slice = list.slice(curPage * PAGE_SIZE, (curPage + 1) * PAGE_SIZE);

  var h = '';

  h += '<div class="search-bar-row"><input id="name-search" class="search-input" type="text" placeholder="ابحث بالاسم (مثل: الله، الرحمن، اللطيف) أو الرقم (١–٩٩)..." value="' + esc(q) + '" aria-label="ابحث في الأسماء الحسنى"></div>';

  var allNotes = allRecordedNotes();
  var filterTabs = ['الكل', 'المفضلة', 'المضاءة', 'مواقفي'].concat(CATEGORIES.slice(1));
  h += '<div class="filter-scroll-row" role="tablist" aria-label="تصنيفات الأسماء">';
  filterTabs.forEach(function(cat) {
    var on = cat === catF;
    var label = cat === 'الكل' ? 'الكل (٩٩)' : (cat === 'المفضلة' ? '♡ المفضلة (' + ar(fc) + ')' : (cat === 'المضاءة' ? '✦ المختومة (' + ar(dn) + ')' : (cat === 'مواقفي' ? '✎ مواقفي (' + ar(allNotes.length) + ')' : cat)));
    h += '<button type="button" class="dhikr-pill' + (on ? ' active' : '') + '" data-cat-filter="' + esc(cat) + '">' + esc(label) + '</button>';
  });
  h += '</div>';

  if (catF === 'مواقفي') {
    if (allNotes.length) {
      h += '<section class="stack" style="gap:10px">';
      allNotes.forEach(function(note) {
        h += '<div class="latifa-card"><div class="row"><button type="button" class="l-title" data-open-sheet="' + note.epId + '">✦ مع اسم الله «' + esc(note.epName) + '» • ' + esc(note.date) + ' ←</button><button type="button" class="tiny muted" data-del-ep-note="' + note.epId + '" data-del-idx="' + note.idx + '">حذف</button></div><p class="l-body">' + esc(note.text) + '</p></div>';
      });
      h += '</section>';
    } else {
      h += '<p class="notice">لم تدوّن مواقف بعد. المس أي اسم مفتوح واكتب موقفاً أو خاطرة في نافذة تفاصيله لتظهر هنا.</p>';
    }
    return h;
  }

  if (!slice.length) {
    h += '<p class="notice">' + (catF === 'المفضلة' ? 'لم تضف أي اسم إلى المفضلة بعد. يمكنك حفظ أي اسم من داخل نافذة تفاصيله.' : 'لا توجد أسماء مطابقة لبحثك حالياً.') + '</p>';
  } else {
    h += '<div class="clean-names-grid">';
    slice.forEach(function(e) {
      var isLit = !!store.done[e.id];
      var unlocked = isEpUnlocked(e);
      var isCur = unlocked && !isLit;
      var tileCls = 'clean-tile' + (isLit ? ' is-lit' : (isCur ? ' is-current-frontier' : ' is-locked'));
      h += '<button type="button" class="' + tileCls + '" data-open-sheet="' + e.id + '">';
      /* ١. الرقم وحالة الفتح أو القفل */
      h += '<div class="clean-tile-top"><span class="clean-tile-num">#' + ar(e.num) + '</span><span class="clean-tile-status">' + (isLit ? '✓ مختوم' : (isCur ? '✦ محطتك' : '🔒 مغلق')) + '</span></div>';
      /* ٢. اسم الجلالة */
      h += '<span class="display clean-tile-name">' + esc(e.name) + '</span>';
      /* ٣. وصف وجيز أو متطلب الفتح */
      h += '<span class="clean-tile-tag">' + (unlocked ? esc(e.tag) : 'يُفتح بعد تختيم #' + ar(e.num - 1) + ' «' + esc(EPISODES[e.num - 2].name) + '»') + '</span>';
      h += '</button>';
    });
    h += '</div>';

    if (totalPages > 1) {
      h += '<nav class="pager-bar" aria-label="صفحات الأسماء الحسنى">';
      h += '<button type="button" class="pager-btn" data-names-page="' + Math.max(0, curPage - 1) + '"' + (curPage === 0 ? ' disabled' : '') + '>→ السابقة</button>';
      h += '<div class="pager-nums">';
      for (var p = 0; p < totalPages; p++) {
        var fromN = p * PAGE_SIZE + 1;
        var toN = Math.min(list.length, (p + 1) * PAGE_SIZE);
        h += '<button type="button" class="pager-num' + (p === curPage ? ' active' : '') + '" style="width:auto;padding:0 12px" data-names-page="' + p + '">' + ar(fromN) + '–' + ar(toN) + '</button>';
      }
      h += '</div>';
      h += '<button type="button" class="pager-btn" data-names-page="' + Math.min(totalPages - 1, curPage + 1) + '"' + (curPage >= totalPages - 1 ? ' disabled' : '') + '>التالية ←</button>';
      h += '</nav>';
    }
  }

  return h;
}

function totalTasbihToday() {
  if (!store.tasbih || store.tasbih.k !== todayKey() || !store.tasbih.byId) return 0;
  var sum = 0;
  for (var k in store.tasbih.byId) {
    if (typeof store.tasbih.byId[k] === 'number') sum += store.tasbih.byId[k];
  }
  return sum;
}

function getWirdCount(wId) {
  var tk = todayKey();
  if (!store.wirdCounts || store.wirdCounts.k !== tk || !store.wirdCounts.byId) return 0;
  return store.wirdCounts.byId[wId] || 0;
}

function completedWirdsToday() {
  var c = 0;
  for (var i = 0; i < WIRD_ITEMS.length; i++) {
    if (getWirdCount(WIRD_ITEMS[i].id) >= WIRD_ITEMS[i].target) c++;
  }
  return c;
}

/* ٣. تبويب «الذكر» المصفّى: محراب واحد مركّز بـ ٣ أطوار غير مشتّتة (مسبحة النور | ورد الصباح والمساء | بوصلة القلب) */
function vDhikr() {
  var mode = store.dhikrMode || 'tasbih';
  var dhIdx = (store.dhikrIdx || 0) % ADHKAR.length;
  var dh = ADHKAR[dhIdx];
  var n = tasbihN();
  var totalToday = totalTasbihToday();
  var wirdDoneCount = completedWirdsToday();
  var hs = currentHeartState();
  var hsEp = byId(hs.epId) || todayEpisode();
  var isHsUnlocked = isEpUnlocked(hsEp);

  var h = '<div class="dhikr-sanctuary-shell">';

  /* ١. الشريط العلوي الموحّد (مبدّل الأطوار الثلاثة بأسلوب Apple الهادئ) */
  h += '<div class="dhikr-mode-switch" role="tablist" aria-label="أطوار الذكر والسكينة">';
  h += '<button type="button" class="' + (mode === 'tasbih' ? 'active' : '') + '" data-dhikr-mode="tasbih">📿 مسبحة النور</button>';
  h += '<button type="button" class="' + (mode === 'wird' ? 'active' : '') + '" data-dhikr-mode="wird">🌅 ورد اليوم (' + ar(wirdDoneCount) + '/' + ar(WIRD_ITEMS.length) + ')</button>';
  h += '<button type="button" class="' + (mode === 'compass' ? 'active' : '') + '" data-dhikr-mode="compass">🧭 بوصلة القلب</button>';
  h += '</div>';

  /* ٢. الطور الأول: مسبحة النور التفاعلية المتمركزة */
  if (mode === 'tasbih') {
    h += '<div class="filter-scroll-row" role="tablist" aria-label="اختر الذكر">';
    ADHKAR.forEach(function(item, idx) {
      var on = idx === dhIdx;
      var itemCnt = (store.tasbih && store.tasbih.k === todayKey() && store.tasbih.byId && store.tasbih.byId[item.id]) || 0;
      var doneMark = itemCnt >= item.goal ? '✓ ' : '';
      h += '<button type="button" class="dhikr-pill' + (on ? ' active' : '') + '" data-dhikr-idx="' + idx + '">' + doneMark + esc(item.short || item.t) + '</button>';
    });
    h += '</div>';

    h += '<section class="dhikr-stage-card" aria-label="مسبحة النور">';
    h += '<div class="row" style="width:100%"><span class="bento-num">الذكر ' + ar(dhIdx + 1) + ' من ' + ar(ADHKAR.length) + '</span>';
    h += '<span class="tiny sage">مجموع تسبيحك اليوم: <strong>' + ar(totalToday) + '</strong></span></div>';

    h += '<h1 class="dhikr-phrase-title">' + esc(dh.t) + '</h1>';

    /* الدائرة المركزية الكبرى المريحة للإبهام */
    h += '<div class="tasbih-orb-stage">';
    h += '<button type="button" class="tasbih-orb-btn' + (n >= dh.goal ? ' bead-complete' : '') + '" id="bead" aria-label="سبّح: ' + esc(dh.t) + '">';
    h += beadRingSVG(n, dh.goal);
    h += '<span class="num" id="bead-num">' + (n ? ar(n) : 'سبّح') + '</span>';
    h += '<span class="sub-goal" id="bead-sub">' + (n ? 'من ' + ar(dh.goal) : 'المس الدائرة للتسبيح') + '</span>';
    h += '</button></div>';

    h += '<p class="dhikr-reward-box">' + esc(dh.reward) + '</p>';

    h += '<div class="row" style="width:100%;padding-top:4px;border-top:1px solid rgba(255,255,255,0.06)">';
    h += '<span class="tiny ' + (n >= dh.goal ? 'gold' : 'muted') + '" id="bead-msg">' + (n >= dh.goal ? '✦ أتممت هذا الورد المبارك — تقبّل الله منك' : 'الهدف: ' + ar(dh.goal) + ' مرة • ينتقل تلقائياً للذكر التالي عند التمام') + '</span>';
    h += '<button type="button" class="tiny muted" id="bead-reset"' + (n ? '' : ' hidden') + '>تصفير</button>';
    h += '</div>';
    h += '</section>';
  }

  /* ٣. الطور الثاني: ورد الصباح والمساء (بطاقة واحدة متسلسلة بلا تشتيت) */
  else if (mode === 'wird') {
    var wIdx = Math.min(Math.max(0, store.wirdIdx || 0), WIRD_ITEMS.length - 1);
    var wItem = WIRD_ITEMS[wIdx];
    var wCur = getWirdCount(wItem.id);
    var isWDone = wCur >= wItem.target;
    var remReads = Math.max(0, wItem.target - wCur);

    h += '<section class="dhikr-stage-card" style="gap:14px" aria-label="ورد الصباح والمساء">';
    h += '<div class="row" style="width:100%">';
    h += '<span class="bento-num">الورد ' + ar(wIdx + 1) + ' من ' + ar(WIRD_ITEMS.length) + '</span>';
    h += '<div class="sub-dots">';
    for (var wi = 0; wi < WIRD_ITEMS.length; wi++) {
      var wiDone = getWirdCount(WIRD_ITEMS[wi].id) >= WIRD_ITEMS[wi].target;
      h += '<i class="' + (wi === wIdx ? 'on' : (wiDone ? 'done' : '')) + '" style="cursor:pointer" data-wird-jump="' + wi + '"></i>';
    }
    h += '</div></div>';

    h += '<h2 class="display gold" style="font-size:26px;line-height:1.25">' + esc(wItem.title) + '</h2>';

    h += '<div class="wird-card-body">';

    h += '</div>';

    h += '<p class="dhikr-reward-box"><strong>فضل الذكر:</strong> ' + esc(wItem.virtue) + '</p>';

    h += '<button type="button" class="wird-counter-btn' + (isWDone ? ' wird-done' : '') + '" data-wird-tap="' + wItem.id + '">';
    if (isWDone) {
      h += '<span>✓ أتممت قراءة هذا الورد (' + ar(wItem.target) + ' من ' + ar(wItem.target) + ') • التالي ←</span>';
    } else if (wItem.target === 1) {
      h += '<span>أتممت قراءته (مرة واحدة) • انتقل للتالي ←</span>';
    } else {
      h += '<span>المس عند كل قراءة • متبقٍّ ' + ar(remReads) + ' من ' + ar(wItem.target) + '</span>';
    }
    h += '</button>';

    h += '<div class="row" style="width:100%;padding-top:2px">';
    h += '<button type="button" class="quiet" style="min-height:38px;padding:0 14px;font-size:13px" data-wird-jump="' + ((wIdx - 1 + WIRD_ITEMS.length) % WIRD_ITEMS.length) + '">→ السابق</button>';
    h += '<button type="button" class="chip" data-copy="' + esc(wItem.text) + '">' + ico(P.copy, 13, '#C9A24B') + '<span>نسخ الذكر</span></button>';
    h += '<button type="button" class="quiet" style="min-height:38px;padding:0 14px;font-size:13px" data-wird-jump="' + ((wIdx + 1) % WIRD_ITEMS.length) + '">التالي ←</button>';
    h += '</div>';
    h += '</section>';
  }

  /* ٤. الطور الثالث: بوصلة القلب (الروشتة الإيمانية المباشرة لحال قلبك) */
  else {
    h += '<div class="filter-scroll-row" role="tablist" aria-label="بماذا يشعر قلبك الآن؟">';
    HEART_STATES.forEach(function(item) {
      var on = item.id === hs.id;
      h += '<button type="button" class="dhikr-pill' + (on ? ' active' : '') + '" data-heart-pick="' + item.id + '">' + esc(item.label) + '</button>';
    });
    h += '</div>';

    h += '<section class="dhikr-stage-card" style="text-align:right;align-items:stretch;gap:14px" aria-label="روشتة بوصلة القلب">';
    h += '<div class="focus-card-kicker"><span class="focus-card-title">✦ ' + esc(hs.title) + '</span><span class="tiny sage">' + esc(hs.label) + '</span></div>';
    h += '<p class="small" style="color:var(--ivory-soft);font-size:15.5px;line-height:1.85">' + esc(hs.counsel) + '</p>';

    h += '<div class="mushaf slim" style="text-align:center"><p class="quran">' + hs.ayah + '</p><span class="ref center">' + hs.ref + '</span></div>';

    h += '<div class="focus-card-sub" style="display:flex;flex-direction:column;gap:8px">';
    h += '<div class="row"><span class="tiny gold" style="font-weight:700">مناجاة السكينة لحالك الآن:</span><button type="button" class="tiny gold" data-copy="' + esc(hs.dua) + '">نسخ الدعاء</button></div>';
    h += '<p class="small" style="color:var(--ivory);font-size:15.5px;line-height:1.8">«' + esc(hs.dua) + '»</p>';
    h += '</div>';

    if (isHsUnlocked) {
      h += '<button type="button" class="cta" style="min-height:44px;font-size:14.5px;width:100%" data-open-sheet="' + hsEp.id + '"><span>افتح محراب اسم الله «' + esc(hsEp.name) + '»</span></button>';
    } else {
      var curF = nextEpisode();
      h += '<button type="button" class="quiet" style="width:100%" data-go="home"><span>محراب «' + esc(hsEp.name) + '» يُفتح في الخريطة بالترتيب • تابع محطتك الحالية (#' + ar(curF.num) + ' ' + esc(curF.name) + ') ←</span></button>';
    }
    h += '</section>';
  }

  h += '</div>';
  return h;
}

function measureWrappedLines(ctx, text, maxWidth) {
  var words = String(text || '').split(' ');
  var lines = [];
  var line = '';
  for (var n = 0; n < words.length; n++) {
    var testLine = line + words[n] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function drawPosterCanvasNow() {
  try {
    var c = document.getElementById('poster-canvas');
    if (!c || !c.getContext) return;
    var ep = byId(store.posterId) || todayEpisode();
    var ratio = store.posterRatio || '4:5';
    var theme = store.posterTheme || 'night';

    if (ratio === '9:16') { c.width = 540; c.height = 960; }
    else if (ratio === '1:1') { c.width = 540; c.height = 540; }
    else { c.width = 540; c.height = 675; }

    var ctx = c.getContext('2d');
    var W = c.width, H = c.height;
    ctx.direction = 'rtl';

    var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    if (theme === 'gold') {
      bgGrad.addColorStop(0, '#191308');
      bgGrad.addColorStop(0.5, '#1F180B');
      bgGrad.addColorStop(1, '#120E07');
    } else if (theme === 'sage') {
      bgGrad.addColorStop(0, '#091310');
      bgGrad.addColorStop(0.5, '#0F1D19');
      bgGrad.addColorStop(1, '#13241F');
    } else {
      bgGrad.addColorStop(0, '#090B0E');
      bgGrad.addColorStop(0.5, '#0E1116');
      bgGrad.addColorStop(1, '#151A21');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    var radGlow = ctx.createRadialGradient(W / 2, H * 0.24, 10, W / 2, H * 0.24, 210);
    radGlow.addColorStop(0, 'rgba(229, 193, 104, 0.22)');
    radGlow.addColorStop(1, 'rgba(201, 162, 75, 0)');
    ctx.fillStyle = radGlow;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    var archTop = ratio === '9:16' ? 46 : 22;
    var archShoulder = ratio === '9:16' ? 230 : (ratio === '1:1' ? 165 : 195);
    ctx.strokeStyle = '#C9A24B';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(42, H - 34);
    ctx.lineTo(42, archShoulder);
    ctx.bezierCurveTo(42, archTop + 65, 155, archTop + 25, W / 2, archTop);
    ctx.bezierCurveTo(W - 155, archTop + 25, W - 42, archTop + 65, W - 42, archShoulder);
    ctx.lineTo(W - 42, H - 34);
    ctx.stroke();

    var curY = ratio === '9:16' ? 175 : (ratio === '1:1' ? 112 : 142);

    ctx.fillStyle = 'rgba(201, 162, 75, 0.85)';
    ctx.textAlign = 'center';
    ctx.font = '600 14px "IBM Plex Sans Arabic", sans-serif';
    ctx.fillText('✦ الاسم #' + ar(ep.num) + ' من أسماء الله الحسنى ✦', W / 2, curY);

    var plainLen = normAr(ep.name).length;
    var nameFontSize = plainLen > 10 ? 44 : (ratio === '1:1' ? 54 : 62);
    curY += nameFontSize + 10;
    ctx.fillStyle = '#E5C168';
    ctx.font = 'bold ' + nameFontSize + 'px "Aref Ruqaa", Georgia, serif';
    ctx.fillText(ep.name, W / 2, curY);

    curY += 34;
    ctx.fillStyle = '#93B4A2';
    ctx.font = '500 16.5px "IBM Plex Sans Arabic", sans-serif';
    var tagLines = measureWrappedLines(ctx, ep.tag, W - 130);
    tagLines.slice(0, 2).forEach(function(ln) {
      ctx.fillText(ln, W / 2, curY);
      curY += 24;
    });

    curY += 10;
    ctx.fillStyle = '#F3ECE0';
    ctx.font = '400 ' + (ratio === '1:1' ? '16.5px' : '18px') + ' "IBM Plex Sans Arabic", sans-serif';
    var meaningLines = measureWrappedLines(ctx, ep.meaning, W - 136);
    var maxMeaningLines = ratio === '1:1' ? 2 : 3;
    meaningLines.slice(0, maxMeaningLines).forEach(function(ln) {
      ctx.fillText(ln, W / 2, curY);
      curY += 27;
    });

    curY += 10;
    var boxX = 66, boxW = W - 132;
    ctx.font = (ratio === '1:1' ? '18.5px' : '20.5px') + ' "Amiri Quran", Georgia, serif';
    var ayahLines = measureWrappedLines(ctx, ep.ayah, boxW - 32);
    var maxAyahLines = ratio === '1:1' ? 2 : 3;
    var shownAyah = ayahLines.slice(0, maxAyahLines);
    var boxH = Math.max(96, shownAyah.length * 31 + 48);

    ctx.fillStyle = '#F3ECE0';
    roundRect(ctx, boxX, curY, boxW, boxH, 16);
    ctx.fill();

    ctx.fillStyle = '#0E1116';
    var ayTextY = curY + 36;
    shownAyah.forEach(function(ln) {
      ctx.fillText(ln, W / 2, ayTextY);
      ayTextY += 31;
    });

    ctx.fillStyle = '#6B4F10';
    ctx.font = '600 13.5px "IBM Plex Sans Arabic", sans-serif';
    ctx.fillText(ep.ref, W / 2, curY + boxH - 13);

    curY += boxH + 34;

    if (ratio === '9:16' && ep.dua && ep.dua.t && curY < H - 140) {
      ctx.fillStyle = '#E2BE6B';
      ctx.font = '500 17px "IBM Plex Sans Arabic", sans-serif';
      var duaLines = measureWrappedLines(ctx, '«' + ep.dua.t + '»', W - 140);
      duaLines.slice(0, 3).forEach(function(ln) {
        ctx.fillText(ln, W / 2, curY);
        curY += 28;
      });
    }

    ctx.fillStyle = '#C9A24B';
    ctx.font = 'bold 18px "Aref Ruqaa", Georgia, serif';
    ctx.fillText('مِشكاة — زادك اليومي', W / 2, H - 46);
    ctx.restore();
  } catch (e) {}
}

function drawPosterCanvas() {
  drawPosterCanvasNow();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() {
      drawPosterCanvasNow();
    }).catch(function() {});
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  var words = String(text || '').split(' ');
  var line = '';
  for (var n = 0; n < words.length; n++) {
    var testLine = line + words[n] + ' ';
    var metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && n > 0) {
      ctx.fillText(line.trim(), x, y);
      line = words[n] + ' ';
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, y);
}

/* ================= الجلسة اليومية الخماسية ================= */
function vSession() {
  var s = session(), ep = byId(s.id) || todayEpisode();
  if (s.step > 5) return vFinish(ep);
  var st = s.step;
  var sub = typeof s.sub === 'number' ? s.sub : 0;

  var h = '<div class="session-shell">';

  /* ١. الشريط العلوي الموحّد */
  h += '<header class="topbar" style="padding-bottom:4px">';
  h += '<button type="button" class="iconbtn" id="s-back" aria-label="' + ((st > 1 || sub > 0) ? 'الخطوة السابقة' : 'اخرج من الجلسة') + '">' + ico((st > 1 || sub > 0) ? P.back : P.cross, 20) + '</button>';
  h += '<div class="steps-wrap" style="gap:6px"><div class="steps" role="img" aria-label="الخطوة ' + ar(st) + ' من ٥">';
  for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= st ? 'on' : '') + '"></i>';
  h += '</div>';
  h += '<span class="tiny gold" style="text-align:center;font-weight:600">الخطوة ' + ar(st) + ' من ٥ • ' + STEP_NAMES[st - 1] + '</span>';
  h += '</div>';
  h += '<span class="t" style="min-width:44px;text-align:left">' + ar(st) + ' / ٥</span></header>';

  /* ٢. منطقة العرض الوسطى: بطاقة واحدة مركّزة فقط في كل شاشة */
  h += '<div class="session-center-stage">';

  /* شريط تعريف الاسم المدمج أعلى البطاقة */
  h += '<div class="session-Identity-pill">';
  h += '<div style="display:flex;align-items:center;gap:10px">';
  h += '<span class="bento-num">#' + ar(ep.num) + '</span>';
  h += '<span class="display gold" style="font-size:32px;line-height:1">' + esc(ep.name) + '</span>';
  h += '</div>';
  h += '<span class="tiny sage">' + esc(ep.tag) + '</span>';
  h += '</div>';

  if (st === 1) {
    var cards = ep.cards || [
      { title: 'الدلالة القرآنية واللغوية', body: ep.meaning },
      { title: 'تجلّي الاسم في حياتك', body: ep.tafsir },
      { title: 'رسالة السكينة لقلبك اليوم', body: ep.act }
    ];
    var dots = '<span class="sub-dots" aria-label="بطاقة ' + ar(sub + 1) + ' من ٣">';
    for (var di = 0; di < 3; di++) {
      dots += '<i class="' + (di === sub ? 'on' : (di < sub ? 'done' : '')) + '"></i>';
    }
    dots += '</span>';

    h += '<article class="session-focus-card">';
    if (sub === 0) {
      h += '<div class="focus-card-kicker"><span class="focus-card-title">✦ ١. معنى اسم الله «' + esc(ep.name) + '»</span>' + dots + '</div>';
      h += '<p class="focus-card-body">' + esc(ep.meaning) + '</p>';
      h += '<div class="focus-card-sub"><strong>إشراقة المعنى:</strong> ' + esc(cards[0].body) + '</div>';
    } else if (sub === 1) {
      h += '<div class="focus-card-kicker"><span class="focus-card-title">✦ ٢. تجلّي الاسم في حياتك</span>' + dots + '</div>';
      h += '<p class="focus-card-body">' + esc(cards[1] ? cards[1].body : ep.tafsir) + '</p>';
      if (cards[2]) {
        h += '<div class="focus-card-sub"><strong>رسالة السكينة لقلبك:</strong> ' + esc(cards[2].body) + '</div>';
      }
    } else {
      var nuTitle = (ep.nuance && ep.nuance.title) ? ep.nuance.title : ('لطيفة اسم الله «' + ep.name + '»');
      var nuBody = (ep.nuance && ep.nuance.body) ? ep.nuance.body : ep.tafsir;
      h += '<div class="focus-card-kicker"><span class="focus-card-title">✦ ٣. لطائف وفروق الأسماء</span>' + dots + '</div>';
      h += '<p class="small gold" style="font-weight:700;font-size:15.5px">' + esc(nuTitle) + '</p>';
      h += '<p class="focus-card-body">' + esc(nuBody) + '</p>';
    }
    h += '</article>';

    var nextLabel = sub === 0
      ? 'البطاقة التالية (٢ من ٣): تجلّي الاسم ←'
      : (sub === 1 ? 'البطاقة التالية (٣ من ٣): لطائف وفروق الاسم ←' : 'أتممت القراءة • انتقل إلى الآية القرآنية ←');
    h += '</div>';
    h += '<div class="session-foot-bar"><button type="button" class="cta" id="s-next"><span>' + nextLabel + '</span></button></div>';
  } else if (st === 2) {
    h += '<section class="mushaf" style="margin:0"><div class="mushaf-head"><span class="k">✦ الشاهد القرآني لاسم «' + esc(ep.name) + '»</span><span class="ref">' + ep.ref + '</span></div><p class="quran">' + ep.ayah + '</p>';
    h += '<div class="mushaf-tafsir"><strong>التفسير الوجيز:</strong> ' + esc(ep.tafsir) + '</div></section>';
    h += '</div>';
    h += '<div class="session-foot-bar"><button type="button" class="cta" id="s-next"><span>انتقل إلى سؤال التثبيت ←</span></button></div>';
  } else if (st === 3) {
    var picked = s.pick !== null && s.pick !== undefined, right = s.pick === ep.q.a;
    h += '<article class="session-focus-card" style="gap:12px">';
    h += '<div class="focus-card-kicker"><span class="focus-card-title">✦ سؤال تثبيت المعنى</span><span class="tiny muted">اختر الإجابة الصحيحة</span></div>';
    h += '<h2 style="font-size:19px;font-weight:600;line-height:1.65;color:var(--ivory)">' + esc(ep.q.t) + '</h2>';
    h += '<div class="opts">';
    ep.q.opts.forEach(function(o, i) {
      var cls = 'opt', mark = '';
      if (picked && i === ep.q.a) { cls += ' right'; mark = ico(P.check, 20, '#0E1116', { sw: 2.4 }); }
      else if (picked && i === s.pick) { cls += ' wrong'; mark = ico(P.cross, 18, '#A8A294', { sw: 2 }); }
      h += '<button type="button" class="' + cls + '" data-pick="' + i + '"' + (picked ? ' disabled' : '') + '><span>' + esc(o) + '</span>' + mark + '</button>';
    });
    h += '</div>';
    if (picked) {
      h += '<div class="focus-card-sub" role="status"><strong>' + (right ? '✓ أحسنت، إجابة صحيحة: ' : 'الإجابة الصحيحة: ') + '</strong>' + esc(ep.q.explain) + '</div>';
    }
    h += '</article></div>';
    h += '<div class="session-foot-bar"><button type="button" class="' + (picked ? 'cta' : 'cta soft') + '" id="s-next"><span>' + (picked ? 'انتقل إلى الدعاء بالاسم ←' : 'تخطَّ السؤال') + '</span></button></div>';
  } else if (st === 4) {
    h += '<article class="session-focus-card">';
    h += '<div class="focus-card-kicker"><span class="focus-card-title">✦ ٤. مناجاة الله باسمه «' + esc(ep.name) + '»</span><span class="tiny muted">ادعُ بقلبك</span></div>';
    h += '<p class="focus-card-body" style="color:var(--gold-bright);font-size:19px;line-height:1.95">«' + esc(ep.dua.t) + '»</p>';
    h += '<div style="display:flex;justify-content:flex-end"><button type="button" class="chip" data-copy="' + esc(ep.dua.t) + '">' + ico(P.copy, 13, '#C9A24B') + '<span>نسخ الدعاء</span></button></div>';
    h += '</article></div>';
    h += '<div class="session-foot-bar"><button type="button" class="cta" id="s-next"><span>آمين • انتقل إلى عمل اليوم ←</span></button></div>';
  } else {
    h += '<article class="session-focus-card">';
    h += '<div class="focus-card-kicker"><span class="focus-card-title">✦ ٥. أثر الاسم في يومك</span><span class="tiny gold">الخطوة الأخيرة</span></div>';
    h += '<p class="focus-card-body" style="font-size:18.5px">' + esc(ep.act) + '</p>';
    h += '<div class="focus-card-sub">بإتمامك لهذه الخطوة يُختم اسم الله <strong>«' + esc(ep.name) + '»</strong> ويُفتح لك الاسم التالي في الخريطة.</div>';
    h += '</article></div>';
    h += '<div class="session-foot-bar"><button type="button" class="cta" id="s-next"><span>✓ أتممت المرحلة وافتح الاسم التالي</span></button></div>';
  }

  return h + '</div>';
}

function vFinish(ep) {
  var st = streak(), tomorrow = nextEpisode();
  var allDone = doneCount() >= 99;
  var h = '<div class="page" style="gap:16px;padding-top:16px;padding-bottom:28px">';
  h += '<div class="niche finish">' + frame() + '<span class="glow"></span>' + mishkatLampSVG(62, true);
  h += '<span class="tiny sage" style="font-weight:600">✓ اكتملت المرحلة #' + ar(ep.num) + ' بنجاح</span>';
  h += '<h1 class="display gold" style="font-size:32px;line-height:1.3">أتممت تختيم «' + esc(ep.name) + '»</h1>';
  h += '<p class="small muted">ختمت الآن ' + ar(doneCount()) + ' من ٩٩ مرحلة في مِشكاة.</p>';
  if (!allDone && tomorrow) {
    h += '<span class="chip lit-chip" style="margin-top:4px">🔓 فُتحت لك المرحلة #' + ar(tomorrow.num) + ': «' + esc(tomorrow.name) + '»</span>';
  }
  h += '</div>';

  h += '<section class="stack" style="gap:10px">' + weekHTML() + '</section>';

  h += '<div class="stack" style="gap:10px;padding-top:4px">';
  if (!allDone && tomorrow) {
    h += '<button type="button" class="cta" style="min-height:50px;width:100%" data-start-ep-session="' + tomorrow.id + '"><span>ابدأ المرحلة #' + ar(tomorrow.num) + ' «' + esc(tomorrow.name) + '» الآن ←</span></button>';
  }
  h += '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%">';
  h += '<button type="button" class="quiet" style="min-height:46px;width:100%" data-go="home">' + ico(P.home, 17, '#C9A24B') + '<span>الرئيسية (اليوم)</span></button>';
  h += '<button type="button" class="quiet" style="min-height:46px;width:100%" data-go="journey">' + ico(P.path, 17, '#C9A24B') + '<span>خريطة التختيم</span></button>';
  h += '</div></div>';
  return h + '</div>';
}

/* ================= صفحة محراب الاسم الفردي + دفتر المواقف الخاصة بالاسم ================= */
function nuanceHTML(ep) {
  if (!ep || !ep.nuance) return '';
  return '<section class="nuance-card" aria-label="لطائف وفروق الأسماء المتقاربة">' +
    '<span class="nuance-badge">✦ لطائف وفروق الأسماء المتقاربة</span>' +
    '<h3 class="nuance-title">' + esc(ep.nuance.title) + '</h3>' +
    '<p class="nuance-body">' + esc(ep.nuance.body) + '</p>' +
    '</section>';
}

function openEpSheet(epId) {
  var ep = byId(epId) || todayEpisode();
  if (!isEpUnlocked(ep)) {
    var curF = nextEpisode();
    showToast('🔒 محراب «' + ep.name + '» مغلق — اختم المرحلة #' + ar(curF.num) + ' «' + curF.name + '» أولاً ليُفتح لك بالترتيب!');
    return;
  }
  store.sheetEpId = ep.id;
  var modal = document.getElementById('ep-sheet-modal');
  if (!modal) return;
  renderEpSheet();
  modal.hidden = false;
}

function closeEpSheet() {
  var modal = document.getElementById('ep-sheet-modal');
  if (modal) modal.hidden = true;
  store.sheetEpId = null;
}

function renderEpSheet() {
  var modal = document.getElementById('ep-sheet-modal');
  if (!modal || !store.sheetEpId) return;
  var ep = byId(store.sheetEpId);
  if (!ep) return;
  var isLit = !!store.done[ep.id];
  var sTab = store.sheetTab || 'meaning';
  var epNotesList = (store.epNotes && store.epNotes[ep.id]) ? store.epNotes[ep.id] : [];

  var head = document.getElementById('ep-sheet-header');
  var body = document.getElementById('ep-sheet-body');

    '</div>' +
    '<div style="display:flex;align-items:center;gap:6px">' +
      favBtnHTML(ep.id, false) +

    b += '<section class="latifa-card"><span class="l-title">✦ عمل اليوم بهذا الاسم</span><p class="l-body">' + esc(ep.act) + '</p></section>';
  } else {

    b += '<button type="button" class="cta" style="min-height:42px;font-size:14px" data-save-sheet-note="' + ep.id + '">احفظ الموقف</button>';

  body.innerHTML = b;
}

function vEpisode(ep) {
  var idx = EPISODES.indexOf(ep);
  var prv = EPISODES[(idx - 1 + EPISODES.length) % EPISODES.length];
  var nxt = EPISODES[(idx + 1) % EPISODES.length];

/* يمكنك وضع مفاتيح مشروعك في Firebase هنا مباشرة أو لصقها من داخل لوحة إعدادات Firebase في الموقع */
var DEFAULT_FIREBASE_CONFIG = {
  apiKey: 'AIzaSyBaxzenQST_Z74rS7oaW8t-7JoNqr-vnLQ',
  authDomain: 'mishkat-pro.firebaseapp.com',
  databaseURL: 'https://mishkat-pro-default-rtdb.firebaseio.com',
  projectId: 'mishkat-pro'
};

function getFirebaseConfig() {
  try {
    if (store.fbConfig && store.fbConfig.apiKey) return store.fbConfig;
    var raw = localStorage.getItem('mishkat-firebase-config');
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.apiKey) return parsed;
    }
  } catch (e) {}
  return DEFAULT_FIREBASE_CONFIG;
}

function hasFirebaseAuthConfigured() {
  var cfg = getFirebaseConfig();
  return !!(cfg && cfg.apiKey && cfg.apiKey.length > 10);
}

function parseFirebaseConfigInput(rawText) {
  var txt = String(rawText || '').trim();
  if (!txt) return null;
  try {
    var j = JSON.parse(txt);
    if (j && j.apiKey) return j;
  } catch (e) {}
  var apiKeyM = txt.match(/apiKey\s*:\s*["']([^"']+)["']/);
  var authDomainM = txt.match(/authDomain\s*:\s*["']([^"']+)["']/);
  var dbUrlM = txt.match(/databaseURL\s*:\s*["']([^"']+)["']/);
  var projIdM = txt.match(/projectId\s*:\s*["']([^"']+)["']/);
  if (apiKeyM) {
    var pId = projIdM ? projIdM[1] : '';
    return {
      apiKey: apiKeyM[1].trim(),
      authDomain: authDomainM ? authDomainM[1].trim() : (pId ? pId + '.firebaseapp.com' : ''),
      databaseURL: dbUrlM ? dbUrlM[1].trim() : (pId ? 'https://' + pId + '-default-rtdb.firebaseio.com' : ''),
      projectId: pId
    };
  }
  if (txt.indexOf('AIza') === 0) {
    return { apiKey: txt, authDomain: '', databaseURL: store.cloudSyncUrl || '', projectId: '' };
  }
  return null;
}

function translateFirebaseError(errCode) {
  var code = String(errCode || '');
  if (code.indexOf('EMAIL_EXISTS') !== -1) return 'هذا البريد الإلكتروني مسجّل بالفعل! انتقل لتبويب «تسجيل الدخول» أو اضغط «نسيت كلمة المرور؟».';
  if (code.indexOf('EMAIL_NOT_FOUND') !== -1 || code.indexOf('USER_NOT_FOUND') !== -1) return 'لا يوجد حساب مسجّل بهذا البريد الإلكتروني. انتقل إلى تبويب «إنشاء حساب جديد».';
  if (code.indexOf('INVALID_PASSWORD') !== -1 || code.indexOf('INVALID_LOGIN_CREDENTIALS') !== -1) return 'كلمة المرور غير صحيحة. يمكنك الضغط على «نسيت كلمة المرور؟» لإرسال رابط التغيير إلى بريدك.';
  if (code.indexOf('INVALID_EMAIL') !== -1) return 'صيغة البريد الإلكتروني غير صحيحة.';
  if (code.indexOf('WEAK_PASSWORD') !== -1) return 'كلمة المرور ضعيفة؛ يجب أن تتكون من ٦ خانات على الأقل.';
  if (code.indexOf('TOO_MANY_ATTEMPTS_TRY_LATER') !== -1) return 'تم حظر المحاولات مؤقتاً لكثرة الطلبات؛ حاول بعد قليل.';
  if (code.indexOf('USER_DISABLED') !== -1) return 'تم تعطيل هذا الحساب.';
  return 'تعذّر الاتصال بخادم المصادقة (' + code + ') — تأكد من صحة إعدادات Firebase أو اتصالك بالإنترنت.';
}

function fbAuthRequest(endpoint, payload, cb) {
  var cfg = getFirebaseConfig();
  if (!cfg || !cfg.apiKey) {
    cb({ error: 'NO_FIREBASE_KEY' }, null);
    return;
  }
  var url = 'https://identitytoolkit.googleapis.com/v1/' + endpoint + '?key=' + encodeURIComponent(cfg.apiKey);
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.error) {
        cb({ error: (data.error.message || 'AUTH_ERROR') }, null);
      } else {
        cb(null, data);
      }
    })
    .catch(function(err) {
      cb({ error: 'NETWORK_ERROR' }, null);
    });
}

function fbSaveUserDataToRealtimeDB(uid, idToken, name, email, cb) {
  var cfg = getFirebaseConfig();
  var dbUrl = (cfg && cfg.databaseURL) ? cfg.databaseURL : store.cloudSyncUrl;
  if (!dbUrl || dbUrl.indexOf('https://') !== 0) {
    if (cb) cb(false);
    return;
  }
  var cleanBase = dbUrl.replace(/\/+$/, '');
  var fullUrl = cleanBase + '/mishkat_users/' + encodeURIComponent(uid) + '.json' + (idToken ? '?auth=' + encodeURIComponent(idToken) : '');
  fetch(fullUrl, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      uid: uid,
      name: name,
      email: email,
      updatedAt: Date.now(),
      backupCode: encodeBackupPayload()
    })
  })
    .then(function(r) { if (cb) cb(r && r.ok); })
    .catch(function() { if (cb) cb(false); });
}

function fbLoadUserDataFromRealtimeDB(uid, idToken, cb) {
  var cfg = getFirebaseConfig();
  var dbUrl = (cfg && cfg.databaseURL) ? cfg.databaseURL : store.cloudSyncUrl;
  if (!dbUrl || dbUrl.indexOf('https://') !== 0) {
    if (cb) cb(null);
    return;
  }
  var cleanBase = dbUrl.replace(/\/+$/, '');
  var fullUrl = cleanBase + '/mishkat_users/' + encodeURIComponent(uid) + '.json' + (idToken ? '?auth=' + encodeURIComponent(idToken) : '');
  fetch(fullUrl, { method: 'GET', cache: 'no-store' })
    .then(function(r) { return (r && r.ok) ? r.json() : null; })
    .then(function(data) { if (cb) cb(data && data.backupCode ? data : null); })
    .catch(function() { if (cb) cb(null); });
}

  if (!hasFirebaseAuthConfigured() || !store.account || !store.account.idToken || store.account.emailVerified) return;
  fbAuthRequest('accounts:lookup', { idToken: store.account.idToken }, function(err, data) {
    if (err || !data || !data.users || !data.users[0]) {
      if (!silent) showToast('تعذّر التحقق الآن — جرّب تسجيل الدخول مجدداً');
      return;
    }
    var isVer = !!data.users[0].emailVerified;
    if (isVer) {
      store.account.emailVerified = true;
      store.authErrorMsg = '';
      store.backupStatusMsg = '✓ تم تأكيد بريدك الإلكتروني بنجاح!';

/* ================= التنقل السريع الثلاثي ================= */
var view = document.getElementById('view'), nav = document.getElementById('nav');
var TABS = [
  ['home', 'اليوم', P.home],
  ['journey', 'خريطة التختيم', P.path],
  ['dhikr', 'الذكر', P.spark]
];
var stack = ['home'], lastKey = null;
var activeRoute = 'home';

nav.innerHTML = TABS.map(function(t) {
  return '<button type="button" data-go="' + t[0] + '" data-nav-btn="' + t[0] + '">' + ico(t[2], 20) + '<span>' + t[1] + '</span></button>';
}).join('');

function route() {
  return activeRoute || 'home';
}

function go(r) {
  activeRoute = String(r || 'home').replace(/^#\/?/, '') || 'home';
  
document.addEventListener('pointermove', function(e) {
  var hEl = document.getElementById('interactive-hero');
  if (!hEl) return;
  var rect = hEl.getBoundingClientRect();
  if (e.clientY < rect.top || e.clientY > rect.bottom || e.clientX < rect.left || e.clientX > rect.right) return;
  var px = Math.round(((e.clientX - rect.left) / rect.width) * 100);
  var py = Math.round(((e.clientY - rect.top) / rect.height) * 100);
  hEl.style.setProperty('--spot-x', px + '%');
  hEl.style.setProperty('--spot-y', py + '%');
});

render(false);
}

function currentMoodObj() {
  var m = store.mood || 'night';
  for (var i = 0; i < MOODS.length; i++) {
    if (MOODS[i].id === m) return MOODS[i];
  }
  return MOODS[0];
}

function updateHeaderChrome() {
  var logoEl = document.getElementById('header-logo');
  if (logoEl && !logoEl.innerHTML) logoEl.innerHTML = LOGO;
  var st = streak(), dn = doneCount();
  var sc = document.getElementById('streak-chip');
  if (sc) {
    sc.className = 'chip' + ((st > 0 || dn > 0) ? ' lit-chip' : '');
    sc.innerHTML = flame(15, st > 0 || dn > 0) + '<span>' + (dn ? ar(dn) + ' من ٩٩' : (st ? streakText(st) : 'رحلة الـ ٩٩')) + '</span>';
  }
  var moodBtn = document.getElementById('mood-cycle-btn');
  if (moodBtn) {
    moodBtn.textContent = currentMoodObj().label;
  }
  var accBtn = document.getElementById('open-backup-btn');
  if (accBtn) {
    if (store.account && store.account.name) {
      accBtn.className = 'chip lit-chip';
      accBtn.innerHTML = '<span>✓ ' + esc(store.account.name.split(' ')[0]) + '</span>';
    } else {
      accBtn.className = 'chip';
      accBtn.innerHTML = '<span>👤 حسابي</span>';
    }
  }
  document.body.setAttribute('data-mood', store.mood || 'night');
  document.documentElement.style.setProperty('--reader-scale', String(store.fontScale || 1));
}

function render(keep) {
  try {
    var r = route(), ep = r.indexOf('ep-') === 0 ? byId(r.slice(3)) : null, html = '', tab = 'home', key;
    if (ep) { html = vEpisode(ep); tab = 'names'; }
    else if (r === 'session') { html = vSession(); tab = 'home'; }
    else if (r === 'names') { html = vNames(); tab = 'names'; }
    else if (r === 'dhikr') { html = vDhikr(); tab = 'dhikr'; }
    else if (r === 'journey') { html = vJourney(); tab = 'journey'; }
    else { r = 'home'; activeRoute = 'home'; html = vHome(); tab = 'home'; }

    key = r === 'session' ? 'session-' + (sessionDone() ? 'end' : session().step) : r;
    view.innerHTML = html;

    if (key !== lastKey) {
      if (r !== 'session' && stack[stack.length - 1] !== r) stack.push(r);
      if (stack.length > 30) stack.shift();
      if (!keep || r === 'home') {
        view.scrollTop = 0;
      }
    }
    lastKey = key;

    var isActiveSessionSteps = (r === 'session' && session().step <= 5);
    var hdr = document.getElementById('app-header');
    if (hdr) hdr.hidden = isActiveSessionSteps;
    nav.hidden = isActiveSessionSteps;

    var navBtns = document.querySelectorAll('[data-nav-btn]');
    for (var i = 0; i < navBtns.length; i++) {
      var bTab = navBtns[i].getAttribute('data-nav-btn');
      var on = (bTab === tab && !ep);
      navBtns[i].className = on ? 'on' : '';
      if (on) navBtns[i].setAttribute('aria-current', 'page');
      else navBtns[i].removeAttribute('aria-current');
    }

    updateHeaderChrome();
    if (store.sheetEpId) {
      renderEpSheet();
    }
  } catch (err) {
    activeRoute = 'home';
    view.innerHTML = vHome();
  }
}

function completeSession() {
  var s = session();
  store.sess[s.k] = s.id;
  finishName(s.id);
  var nextUnlit = nextEpisode();
  if (nextUnlit) {
    store.heroId = nextUnlit.id;
    store.today = { k: todayKey(), id: nextUnlit.id };
    persist();
  }
}

/* ================= معالج النقرات الموحّد ================= */
document.addEventListener('click', function(e) {
  var rawTarget = e.target;
  while (rawTarget && rawTarget !== document && typeof rawTarget.closest !== 'function') {
    rawTarget = rawTarget.parentNode;
  }
  var t = rawTarget && typeof rawTarget.closest === 'function' ? rawTarget : null;
  if (!t) return;
  var el;

  if (t.closest('[data-open-backup-modal]')) {
    e.preventDefault();
    store.authErrorMsg = '';
    store.backupStatusMsg = '';
    openBackupModal();
    refreshFirebaseVerificationStatus(true);
    return;
  }
  if ((el = t.closest('[data-auth-tab]'))) {
    var modalRootTab = document.getElementById('backup-sheet-body') || document;
    var curIdField = modalRootTab.querySelector('#acc-id-input');
    var curNameField = modalRootTab.querySelector('#acc-name-input');
    if (curIdField) store.draftId = curIdField.value.trim();
    if (curNameField) store.draftName = curNameField.value.trim();
    store.authTab = el.getAttribute('data-auth-tab');
    store.authErrorMsg = '';
    store.backupStatusMsg = '';
    renderBackupModal();
    return;
  }
  if (t.closest('[data-toggle-adv-backup]')) {
    store.showAdvBackup = store.showAdvBackup ? 0 : 1;
    renderBackupModal();
    return;
  }

  if (t.closest('[data-acc-logout]')) {
    /* نحفظ أحدث نسخة من تقدّم المستخدم في حسابه قبل الخروج ثم نعود لوضع الزائر */
    persist();
    var prevIdLabel = (store.account && store.account.idLabel) ? store.account.idLabel : '';
    store.done = {};
    store.favs = {};
    store.epNotes = {};
    store.days = {};
    store.sess = {};
    store.quiz = {};
    store.tasbih = { k: '', n: 0, byId: {} };
    store.wirdCounts = {};
    store.heroId = 'allah';
    store.today = { k: todayKey(), id: 'allah' };
    store.session = { k: todayKey(), id: 'allah', step: 1, sub: 0, pick: null };
    store.account = { uid: '', name: '', idLabel: '', pinHash: '' };
    store.authTab = 'login';
    store.draftId = prevIdLabel;
    store.authErrorMsg = '';
    store.backupStatusMsg = '✓ تم تسجيل الخروج بنجاح — بياناتك محفوظة بأمان في حسابك، سجل دخولك في أي وقت لاسترجاعها.';
    persist();
    updateHeaderChrome();
    renderBackupModal();
    render(true);
    showToast('تم تسجيل الخروج وحفظ بيانات حسابك');
    return;
  }
  if ((el = t.closest('[data-quick-login-uid]'))) {
    var qUid = el.getAttribute('data-quick-login-uid');
    var dbQ = getAccountsDB();
    var targetAcc = dbQ[qUid];
    if (targetAcc && targetAcc.snapshot) {
      var mergedQ = mergeSnapshots(targetAcc.snapshot, createCurrentSnapshot());
      applySnapshotToStore(mergedQ);
      store.account = {
        uid: targetAcc.uid,
        name: targetAcc.name,
        idLabel: targetAcc.idLabel,
        pinHash: targetAcc.pinHash || ''
      };
      store.backupStatusMsg = '✓ أهلاً بعودتك يا ' + targetAcc.name + '! تم استرجاع ختمتك (' + ar(doneCount()) + ' من ٩٩) فوراً.';
      persist();
      updateHeaderChrome();
      renderBackupModal();
      render(true);
      showToast('تم تسجيل الدخول لحساب ' + targetAcc.name + ' ✦');
    }
    return;
  }
  if (t.closest('[data-save-firebase-config]')) {
    var modalRootCfg = document.getElementById('backup-sheet-body') || document;
    var cfgTa = modalRootCfg.querySelector('#firebase-config-textarea');
    var rawCfgTxt = cfgTa ? cfgTa.value.trim() : '';
    var parsedCfg = parseFirebaseConfigInput(rawCfgTxt);
    if (!parsedCfg || !parsedCfg.apiKey) {
      store.authErrorMsg = 'تعذّر قراءة إعدادات Firebase — تأكد من لصق كائن firebaseConfig الذي يحتوي على apiKey.';
      renderBackupModal();
      showToast('تأكد من لصق firebaseConfig الصحيح');
      return;
    }
    store.fbConfig = parsedCfg;
    if (parsedCfg.databaseURL) store.cloudSyncUrl = parsedCfg.databaseURL;
    try { localStorage.setItem('mishkat-firebase-config', JSON.stringify(parsedCfg)); } catch (e) {}
    store.authErrorMsg = '';
    store.showAdvBackup = 0;
    store.backupStatusMsg = '✓ تم ربط Google Firebase Authentication بنجاح! الآن تُرسل رسائل تأكيد البريد واستعادة كلمة المرور الحقيقية لبريد المستخدم.';
    persist();
    renderBackupModal();
    showToast('تم تفعيل Google Firebase Auth بنجاح ✦');
    return;
  }
  if (t.closest('[data-clear-firebase-config]')) {
    store.fbConfig = null;
    try { localStorage.removeItem('mishkat-firebase-config'); } catch (e) {}
    store.backupStatusMsg = 'تم إلغاء ربط Firebase الخارجي والعودة للحفظ المحلي.';
    persist();
    renderBackupModal();
    return;
  }
  if (t.closest('[data-fb-check-verify]')) {
    refreshFirebaseVerificationStatus(false);
    return;
  }
  if (t.closest('[data-fb-send-verify]')) {
    if (!store.account || !store.account.idToken) return;
    fbAuthRequest('accounts:sendOobCode', {
      requestType: 'VERIFY_EMAIL',
      idToken: store.account.idToken
    }, function(err) {
      if (err) {
        store.authErrorMsg = translateFirebaseError(err.error);
      } else {
        store.authErrorMsg = '';
        store.backupStatusMsg = '📩 تم إرسال رابط تأكيد البريد الإلكتروني إلى (' + store.account.idLabel + ')! افتح صندوق بريدك واضغط على الرابط لتأكيد حسابك.';
        showToast('📩 أُرسل رابط التأكيد إلى بريدك الإلكتروني');
      }
      renderBackupModal();
    });
    return;
  }
  if (t.closest('[data-toggle-pw]')) {
    var modalRootPw = document.getElementById('backup-sheet-body') || document;
    var p1 = modalRootPw.querySelector('#acc-pin-input');
    var i1 = modalRootPw.querySelector('#acc-id-input');
    var n1 = modalRootPw.querySelector('#acc-name-input');
    if (p1) store.draftPin = p1.value;
    if (i1) store.draftId = i1.value;
    if (n1) store.draftName = n1.value;
    store.showPw = store.showPw ? 0 : 1;
    renderBackupModal();
    return;
  }
  if (t.closest('[data-save-new-pw]')) {
    var modalRootCh = document.getElementById('backup-sheet-body') || document;
    var npInp = modalRootCh.querySelector('#acc-new-pin-input');
    var newPwVal = toEnglishDigits(npInp ? npInp.value.trim() : '');
    if (!newPwVal || newPwVal.length < 6) {
      store.authErrorMsg = 'كلمة المرور الجديدة يجب أن تكون ٦ خانات على الأقل.';
      renderBackupModal();
      return;
    }
    if (store.account && store.account.uid) {
      if (hasFirebaseAuthConfigured() && store.account.idToken) {
        fbAuthRequest('accounts:update', {
          idToken: store.account.idToken,
          password: newPwVal,
          returnSecureToken: true
        }, function(err, data) {
          if (err) {
            store.authErrorMsg = translateFirebaseError(err.error);
          } else {
            if (data && data.idToken) store.account.idToken = data.idToken;
            store.account.pinHash = simplePinHash(newPwVal);
            store.authTab = 'login';
            store.authErrorMsg = '';
            store.backupStatusMsg = '✓ تم تحديث كلمة المرور في Google Firebase وحفظها بنجاح.';
            persist();
            showToast('تم تغيير كلمة المرور بنجاح ✓');
          }
          renderBackupModal();
        });
      } else {
        store.account.pinHash = simplePinHash(newPwVal);
        store.authTab = 'login';
        store.authErrorMsg = '';
        store.backupStatusMsg = '✓ تم تحديث كلمة المرور وحفظها في حسابك بنجاح.';
        persist();
        renderBackupModal();
        showToast('تم تغيير كلمة المرور بنجاح ✓');
      }
    }
    return;
  }
  if (t.closest('[data-forgot-send-email]')) {
    var modalRootFg = document.getElementById('backup-sheet-body') || document;
    var fgInp = modalRootFg.querySelector('#acc-forgot-id');
    var rawFgEmail = fgInp ? fgInp.value.trim() : '';
    store.draftId = rawFgEmail;
    store.authErrorMsg = '';
    store.backupStatusMsg = '';
    var fgCheck = validateIdentifier(rawFgEmail);
    if (!fgCheck.valid || fgCheck.type !== 'email') {
      store.authErrorMsg = 'يرجى إدخال بريد إلكتروني صحيح (مثال: name@example.com) لإرسال رابط استعادة كلمة المرور إليه.';
      renderBackupModal();
      return;
    }
    if (hasFirebaseAuthConfigured()) {
      el = t.closest('[data-forgot-send-email]');
      if (el) { el.disabled = true; el.innerHTML = '<span>جارٍ إرسال الرسالة لبريدك...</span>'; }
      fbAuthRequest('accounts:sendOobCode', {
        requestType: 'PASSWORD_RESET',
        email: fgCheck.display
      }, function(err) {
        if (err) {
          store.authErrorMsg = translateFirebaseError(err.error);
        } else {
          store.authTab = 'login';
          store.authErrorMsg = '';
          store.backupStatusMsg = '📩 تم إرسال رسالة إعادة تعيين كلمة المرور إلى بريدك (' + fgCheck.display + ')! افتح بريدك الإلكتروني واضغط على الرابط لتعيين كلمة مرورك الجديدة ثم سجل الدخول هنا.';
          showToast('📩 أُرسل رابط تغيير كلمة المرور إلى بريدك الإلكتروني');
        }
        renderBackupModal();
      });

      /* الانتقال للورد التالي عند الضغط بعد الإتمام */
      store.wirdIdx = (wIdxCur + 1) % WIRD_ITEMS.length;
      persist();
      render(true);
      return;
    }
    curWC++;
    store.wirdCounts.byId[wTapId] = curWC;
    markDay();
    persist();
    try { if (navigator.vibrate) navigator.vibrate(curWC >= wObj.target ? 45 : 8); } catch (eV) {}
    if (curWC >= wObj.target) {
      if (wIdxCur < WIRD_ITEMS.length - 1) {
        showToast('✓ أتممت «' + wObj.title + '» — انتقلت للورد التالي');
        store.wirdIdx = wIdxCur + 1;
      } else {
        showToast('ما شاء الله! أتممت أوراد اليوم المباركة كاملة ✦');
      }
    }
    persist();
    render(true);
    return;
  }
  if ((el = t.closest('[data-heart-pick]'))) {
    var pickedH = el.getAttribute('data-heart-pick');
    store.heartId = pickedH;
    store.heartOpen = 1;
    persist();
    render(true);
    return;
  }
  if (t.closest('[data-close-heart]')) {
    store.heartOpen = 0;
    persist();
    render(true);
    return;
  }
  if (t.closest('[data-toggle-tafsir]')) {
    store.tafsirOpen = store.tafsirOpen ? 0 : 1;
    persist();
    render(true);
    return;
  }
  if ((el = t.closest('[data-start-ep-session]'))) {
    var epId = el.getAttribute('data-start-ep-session');
    var sessEp = byId(epId);
    if (!sessEp || !isEpUnlocked(sessEp)) {
      var curFront2 = nextEpisode();
      showToast('🔒 اختم المرحلة #' + ar(curFront2.num) + ' «' + curFront2.name + '» أولاً لفتح هذه المرحلة!');
      return;
    }
    closeEpSheet();
    store.session = { k: todayKey(), id: epId, step: 1, sub: 0, pick: null };
    delete store.sess[todayKey()];
    persist();
    go('session');
    return;
  }
  if ((el = t.closest('[data-poster-jump]'))) {
    openPosterModal(el.getAttribute('data-poster-jump'));
    return;
  }
  if (t.closest('#close-poster-modal') || (e.target && e.target.id === 'poster-modal')) {
    closePosterModal();
    return;
  }
  if ((el = t.closest('[data-poster-ratio]'))) {
    store.posterRatio = el.getAttribute('data-poster-ratio');
    persist();
    syncPosterModalControls();
    drawPosterCanvas();
    return;
  }
  if ((el = t.closest('[data-poster-theme]'))) {
    store.posterTheme = el.getAttribute('data-poster-theme');
    persist();
    syncPosterModalControls();
    drawPosterCanvas();
    return;
  }
  if (t.closest('#download-poster')) {
    var c = document.getElementById('poster-canvas');
    if (c && c.toDataURL) {
      var a = document.createElement('a');
      a.download = 'mishkat-' + (store.posterId || 'card') + '.png';
      a.href = c.toDataURL('image/png');
      a.click();
      showToast('تم حفظ بطاقة النور كصورة');
    }
    return;
  }
  if (t.closest('#copy-poster-txt')) {
    var pEp = byId(store.posterId) || todayEpisode();
    copyText('اسم الله «' + pEp.name + '» — ' + pEp.meaning + '\n' + pEp.ayah + ' (' + pEp.ref + ')\nالدعاء: ' + pEp.dua.t, 'تم نسخ نص البطاقة');
    return;
  }
  if ((el = t.closest('[data-copy]'))) {
    copyText(el.getAttribute('data-copy'), 'تم نسخ النص لمشاركته');
    return;
  }
  if (t.closest('[data-next-ayah]')) {
    var curAy = store.ayahIdx !== null ? store.ayahIdx : (dayIndex() % AYAT.length);
    store.ayahIdx = (curAy + 1) % AYAT.length;
    persist();
    render(true);
    return;
  }
  if (t.closest('[data-toggle-act]')) {
    var tk = todayKey();
    store.acts[tk] = store.acts[tk] ? 0 : 1;
    persist();
    if (store.acts[tk]) {
      showToast('تقبّل الله منك عمل اليوم');
    }
    render(true);
    return;
  }
  if ((el = t.closest('[data-dhikr-idx]'))) {
    store.dhikrIdx = parseInt(el.getAttribute('data-dhikr-idx'), 10) || 0;
    persist();
    render(true);
    return;
  }
  if ((el = t.closest('[data-cat-filter]'))) {
    store.catFilter = el.getAttribute('data-cat-filter');
    store.namesPage = 0;
    persist();
    render(true);
    return;
  }
  if ((el = t.closest('[data-sheet-tab]'))) {
    store.sheetTab = el.getAttribute('data-sheet-tab');
    renderEpSheet();
    return;
  }
  if (t.closest('#s-next')) {
    var s = session();
    if (typeof s.sub !== 'number') s.sub = 0;
    if (s.step === 1 && s.sub < 2) {
      s.sub++;
      persist();
      render(false);
      return;
    }
    if (s.step >= 5) {
      s.step = 6;
      completeSession();
    } else {
      s.step++;
      s.sub = 0;
      persist();
    }
    if (!store.seen) { store.seen = 1; persist(); }
    render(false);
    return;
  }
  if (t.closest('#s-back')) {
    var s2 = session();
    if (typeof s2.sub !== 'number') s2.sub = 0;
    if (s2.step === 1 && s2.sub > 0) {
      s2.sub--;
      persist();
      render(false);
      return;
    }
    if (s2.step > 1) {
      s2.step--;
      s2.sub = (s2.step === 1) ? 2 : 0;
      persist();
      render(false);
    } else {
      go('home');
    }
    return;
  }
  if ((el = t.closest('[data-pick]'))) {
    var s3 = session(), ep3 = byId(s3.id);
    if (s3.pick !== null && s3.pick !== undefined) return;
    s3.pick = parseInt(el.getAttribute('data-pick'), 10);
    store.quiz[ep3.id] = s3.pick === ep3.q.a ? 1 : 0;
    persist();
    render(true);
    return;
  }
  if (t.closest('#bead')) {
    incrementTasbih();
    return;
  }
  if (t.closest('#bead-reset')) {
    var dReset = currentDhikr();
    if (store.tasbih && store.tasbih.byId) store.tasbih.byId[dReset.id] = 0;
    if (dReset.id === 'subhan' && store.tasbih) store.tasbih.n = 0;
    persist();
    render(true);
    return;
  }
  if (t.closest('[data-reset-init]') || t.closest('#reset')) {
    store.confirmingReset = 1;
    renderBackupModal();
    return;
  }
  if (t.closest('[data-reset-cancel]') || t.closest('#resetno')) {
    store.confirmingReset = 0;
    renderBackupModal();
    return;
  }
  if (t.closest('[data-reset-confirm]') || t.closest('#resetyes')) {
    var activeUid = (store.account && store.account.uid) ? store.account.uid : null;
    if (activeUid) {
      var dbR = getAccountsDB();
      delete dbR[activeUid];
      saveAccountsDB(dbR);
    }
    store = blank();
    store.seen = 1;
    persist();
    closeBackupModal();
    updateHeaderChrome();
    showToast('تمت إعادة ضبط التختيم إلى المرحلة #١');
    render(false);
    return;
  }
});

function incrementTasbih() {
  var k = todayKey();
  var dh = currentDhikr();
  if (!store.tasbih || store.tasbih.k !== k) {
    store.tasbih = { k: k, n: 0, byId: {} };
  }
  if (!store.tasbih.byId) store.tasbih.byId = {};
  var cur = store.tasbih.byId[dh.id] || (dh.id === 'subhan' ? (store.tasbih.n || 0) : 0);
  cur++;
  store.tasbih.byId[dh.id] = cur;
  if (dh.id === 'subhan') store.tasbih.n = cur;
  markDay();
  persist();

  try {
    if (navigator.vibrate) navigator.vibrate(cur === dh.goal ? 50 : 6);
  } catch (e4) {}

  if (cur === dh.goal) {
    var nextIdx = ((store.dhikrIdx || 0) + 1) % ADHKAR.length;
    var nextDh = ADHKAR[nextIdx];
    showToast('✦ أتممت «' + (dh.short || dh.t) + '» (' + ar(dh.goal) + ') • الذكر التالي: ' + (nextDh.short || nextDh.t));
    store.dhikrIdx = nextIdx;
    persist();
    setTimeout(function() { render(true); }, 380);
    return;
  }

  render(true);
  var beadBtn = document.getElementById('bead');
  if (beadBtn) {
    beadBtn.classList.add('bead-pulse');
    setTimeout(function() { if (beadBtn) beadBtn.classList.remove('bead-pulse'); }, 220);
  }
}

document.addEventListener('change', function(e) {
  var s = e.target;
  if (!s) return;
  if (s.id === 'poster-select') {
    store.posterId = s.value;
    persist();
    drawPosterCanvas();
  }
  if (s.id === 'sync-file-input' && s.files && s.files[0]) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var content = String(ev.target.result || '');
        var parsedFile = JSON.parse(content);
        var codeToRestore = parsedFile.backupCode || content;
        var dec = decodeBackupPayload(codeToRestore);
        if (!dec || typeof dec !== 'object') throw new Error('BAD_FILE');
        var mergedFileSnap = mergeSnapshots(dec, createCurrentSnapshot());
        applySnapshotToStore(mergedFileSnap);
        if (parsedFile.account && parsedFile.account.uid) {
          store.account = parsedFile.account;
        } else if (dec.account && dec.account.uid) {
          store.account = dec.account;
        }
        store.backupStatusMsg = '✓ تم استرجاع ملف حسابك وختمتك بنجاح!';
        persist();
        updateHeaderChrome();
        renderBackupModal();
        render(true);
        showToast('تم استرجاع حسابك بالكامل ✦');
      } catch (errF) {
        showToast('تأكد من اختيار ملف حساب مشكاة الصحيح');
      }
    };
    reader.readAsText(s.files[0]);
  }
});

document.addEventListener('input', function(e) {
  var s = e.target;
  if (!s) return;

  if (s.id === 'name-search') {
    store.search = s.value;
    store.namesPage = 0;
    var pos = s.selectionStart;
    render(true);
    var again = view.querySelector('#name-search') || document.getElementById('name-search');
    if (again) {
      again.focus();
      try { again.setSelectionRange(pos, pos); } catch (err) {}
    }
  }
});

document.addEventListener('keydown', function(e) {
  if (e.code === 'Escape') {
    closePosterModal();
    closeEpSheet();
    closeBackupModal();
  }
  if (e.key === 'Enter' && document.activeElement && (document.activeElement.id === 'acc-name-input' || document.activeElement.id === 'acc-id-input' || document.activeElement.id === 'acc-pin-input')) {
    e.preventDefault();
    var subBtn = document.querySelector('#backup-sheet-body [data-acc-submit]');
    if (subBtn) subBtn.click();
    return;
  }
  if (e.code === 'Space' && route() === 'dhikr' && document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'BUTTON') {
    e.preventDefault();
    incrementTasbih();
  }
});

window.addEventListener('focus', function() {
  refreshFirebaseVerificationStatus(true);
});
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) refreshFirebaseVerificationStatus(true);
});

idbRestoreIfNeeded(function() {
  updateHeaderChrome();
  render(true);
});
cacheVaultLoad(function(vault) {
  if (!vault || typeof vault !== 'object') return;
  var changed = false;
  if (vault.accounts && typeof vault.accounts === 'object') {
    for (var uk in vault.accounts) {
      if (!inMemAccountsDB[uk] || (vault.accounts[uk].doneTotal || 0) >= (inMemAccountsDB[uk].doneTotal || 0)) {
        inMemAccountsDB[uk] = vault.accounts[uk];
        changed = true;
      }
    }
    try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(inMemAccountsDB)); } catch (e) {}
  }
  if (vault.store && typeof vault.store === 'object') {
    var curDone = Object.keys(store.done || {}).length;
    var vDone = Object.keys(vault.store.done || {}).length;
    var curHasAcc = !!(store.account && store.account.uid);
    var vHasAcc = !!(vault.store.account && vault.store.account.uid);
    if (vDone > curDone || (!curHasAcc && vHasAcc)) {
      mergeParsedIntoStore(vault.store, store);
      changed = true;
    }
  }
  if (changed) {
    updateHeaderChrome();
    render(true);
  }
});

(function drawStaticStars() {
  var c = document.getElementById('dust-canvas');
  if (!c || !c.getContext) return;
  function paint() {
    c.width = window.innerWidth || 800;
    c.height = window.innerHeight || 600;
    var ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    for (var i = 0; i < 24; i++) {
      var x = ((i * 137.5) % 100) / 100 * c.width;
      var y = ((i * 293.7) % 100) / 100 * c.height;
      var r = (i % 3) * 0.4 + 0.5;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(201, 162, 75, 0.22)';
      ctx.fill();
    }
  }
  paint();
  window.addEventListener('resize', paint);
})();

render(false);
})();
</script>
